name: Desktop – Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build desktop (Tauri)
        run: pnpm --filter desktop exec tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: personaboard-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload to R2
        if: ${{ env.R2_ACCOUNT_ID != '' }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          aws s3 cp "$($exe.FullName)" "s3://$env:R2_BUCKET/PersonaBoard-Setup.exe" `
            --endpoint-url $endpoint --content-disposition "attachment; filename=PersonaBoard-Setup.exe"
