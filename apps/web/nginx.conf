server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Next.js static export: try the file, then its .html variant
  # (Next emits extensionless routes as <route>.html), else the custom 404.
  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }

  # Hashed build assets — cache forever.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Favicon/manifest assets — revalidate occasionally.
  location ~* \.(?:ico|svg|png|json)$ {
    expires 1h;
    add_header Cache-Control "public";
  }

  error_page 404 /404.html;
}
